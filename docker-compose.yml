services:
  db:
    image: postgres:16-alpine
    container_name: manager-library-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - manager_library_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - manager-library

volumes:
  manager_library_pgdata:

networks:
  manager-library:
    name: manager-library
